# CI do JavAI (spec 01, "Deploy"). Actions fixadas por SHA e permissões mínimas por job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers usa o Docker do runner: aqui os testes de papéis, RLS e publicação rodam de verdade.
      - name: Build, testes, ArchUnit e Maven Enforcer
        run: mvn -B verify

  images:
    name: Imagens no GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/gilvan-borges
      TAG: ${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Jars
        run: mvn -B -DskipTests package
      - name: Build das imagens
        run: |
          docker build -t "$REGISTRY/javai-admin-api:$TAG" admin/admin-api
          docker build -t "$REGISTRY/javai-admin-migrations:$TAG" admin/admin-migrations
          docker build -t "$REGISTRY/javai-ai-migrations:$TAG" ai/ai-migrations
          docker build -t "$REGISTRY/javai-ai-indexer:$TAG" ai/ai-indexer
          docker build -t "$REGISTRY/javai-ai-api:$TAG" ai/ai-api
      - name: Trivy (falha com vulnerabilidade alta ou crítica que já tem correção)
        run: |
          for image in javai-admin-api javai-admin-migrations javai-ai-migrations javai-ai-indexer javai-ai-api; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$REGISTRY/$image:$TAG"
          done
      - name: Publica no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for image in javai-admin-api javai-admin-migrations javai-ai-migrations javai-ai-indexer javai-ai-api; do
            docker push "$REGISTRY/$image:$TAG"
          done

  # Deploy na VPS pela Tailscale (spec 01, "Deploy"). Desligado até a variável do repositório
  # DEPLOY_ENABLED valer "true", o que só acontece depois do primeiro deploy manual (infra/README.md).
  deploy:
    name: Deploy na VPS
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # Aparelho temporário com tag:ci-javai, autenticado por OIDC: nenhum segredo da Tailscale fica no GitHub.
      # A política da tailnet só deixa o tag:ci-javai chegar na porta 22 da javai-vps. A tag:ci é de outro
      # projeto da mesma tailnet e não pode ser usada aqui.
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ci-javai
          # Espera a VPS enxergar o aparelho novo antes do SSH (a tailnet propaga peers com atraso).
          ping: ${{ vars.DEPLOY_HOST }}
      # O usuário deploy só aceita o SHA do commit (comando forçado). O GITHUB_TOKEN do job vai pelo stdin, só
      # para baixar as imagens, e expira quando o job termina.
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 "deploy@$DEPLOY_HOST" "$TAG"
