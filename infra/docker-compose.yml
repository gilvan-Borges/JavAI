# JavAI na VPS (spec 01, "Infraestrutura"). Dois lados isolados: o CRUD (admin-*) e a IA (ai-*).
# Cada lado tem o próprio banco e a própria rede de dados; o ai-api entra na Fase 3.
#
# Regra que não pode ser quebrada: só o Caddy publica porta. O Docker ignora o ufw, então qualquer outra
# porta publicada ficaria aberta para a internet.

name: javai

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:

  caddy:
    <<: *endurecido
    image: caddy:2.11.6-alpine
    # Escuta na 8443 dentro do contêiner, sem root; o Docker leva a 443 até ela. A imagem oficial traz o binário
    # com cap_net_bind_service como permissão de arquivo, e com cap_drop ALL o exec falha ("operation not
    # permitted"). Devolver só essa capability resolve, sem abrir mais nada.
    user: "1000:1000"
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - conteudo:/srv/conteudo:ro
    tmpfs:
      - /data:uid=1000,gid=1000
      - /config:uid=1000,gid=1000
      - /tmp
    # controlei-edge: rede externa, criada a mao (infra/README.md, secao 6), onde o Caddy alcanca o gateway do Controlei.
    networks: [edge, ai-edge, controlei-edge]
    mem_limit: 128m
    # Sem depends_on: se o admin-api cair, o snapshot em conteudo. continua no ar.

  postgres-admin:
    <<: *endurecido
    image: postgres:18-alpine
    user: "70:70"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=96MB
      - -c
      - log_connections=on
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina no .env}
    volumes:
      - postgres-admin-data:/var/lib/postgresql
      - ./postgres-admin/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks: [admin-data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-migrate:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/javai-admin-migrations:${JAVAI_TAG:?defina no .env}
    restart: "no"
    environment:
      ADMIN_DB_HOST: postgres-admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina no .env}
      ADMIN_OWNER_PASSWORD: ${ADMIN_OWNER_PASSWORD:?defina no .env}
      ADMIN_APP_PASSWORD: ${ADMIN_APP_PASSWORD:?defina no .env}
    tmpfs:
      - /tmp
    networks: [admin-data]
    mem_limit: 256m
    depends_on:
      postgres-admin:
        condition: service_healthy

  admin-api:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/javai-admin-api:${JAVAI_TAG:?defina no .env}
    environment:
      ADMIN_DB_URL: jdbc:postgresql://postgres-admin:5432/admin?logServerErrorDetail=false&ApplicationName=admin-api
      ADMIN_APP_PASSWORD: ${ADMIN_APP_PASSWORD:?defina no .env}
      ADMIN_ACCESS_JWKS_URI: ${ADMIN_ACCESS_JWKS_URI:?defina no .env}
      ADMIN_ACCESS_ISSUER: ${ADMIN_ACCESS_ISSUER:?defina no .env}
      ADMIN_ACCESS_AUDIENCE: ${ADMIN_ACCESS_AUDIENCE:?defina no .env}
      ADMIN_OWNER_EMAIL: ${ADMIN_OWNER_EMAIL:?defina no .env}
      ADMIN_PORTFOLIO_DEPLOY_HOOK: ${ADMIN_PORTFOLIO_DEPLOY_HOOK:-}
      ADMIN_SNAPSHOT_DIR: /srv/conteudo/v1/snapshot
    volumes:
      - conteudo:/srv/conteudo
    tmpfs:
      - /tmp
    # edge para sair à internet (deploy hook) e ser alcançado pelo Caddy; admin-data para o banco.
    networks: [edge, admin-data]
    mem_limit: 640m
    healthcheck:
      # A imagem não tem curl: o bash abre a conexão com a porta interna do actuator.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      admin-migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------------------------------------
  # Lado da IA. Não compartilha rede de dados nem banco com o CRUD (spec 01, "A regra de isolamento").
  # ---------------------------------------------------------------------------------------------------------

  postgres-ai:
    <<: *endurecido
    image: postgres:18-alpine
    user: "70:70"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=96MB
      - -c
      - log_connections=on
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_AI_PASSWORD:?defina no .env}
    volumes:
      - postgres-ai-data:/var/lib/postgresql
      - ./postgres-ai/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks: [ai-data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-migrate:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/javai-ai-migrations:${JAVAI_TAG:?defina no .env}
    restart: "no"
    environment:
      AI_DB_HOST: postgres-ai
      POSTGRES_PASSWORD: ${POSTGRES_AI_PASSWORD:?defina no .env}
      AI_OWNER_PASSWORD: ${AI_OWNER_PASSWORD:?defina no .env}
      AI_INDEXER_PASSWORD: ${AI_INDEXER_PASSWORD:?defina no .env}
      AI_READER_PASSWORD: ${AI_READER_PASSWORD:?defina no .env}
    tmpfs:
      - /tmp
    networks: [ai-data]
    mem_limit: 256m
    depends_on:
      postgres-ai:
        condition: service_healthy

  ai-indexer:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/javai-ai-indexer:${JAVAI_TAG:?defina no .env}
    environment:
      AI_DB_URL: jdbc:postgresql://postgres-ai:5432/ai?logServerErrorDetail=false&ApplicationName=ai-indexer
      AI_INDEXER_PASSWORD: ${AI_INDEXER_PASSWORD:?defina no .env}
      INDEXER_SNAPSHOT_BASE_URL: ${INDEXER_SNAPSHOT_BASE_URL:-https://conteudo.gilvanborges.com.br}
      INDEXER_MODEL_DIR: /models
      # Porta interna usada pelo botão "reindexar" do /admin. Sem token ela responde 404.
      INDEXER_TRIGGER_TOKEN: ${INDEXER_TRIGGER_TOKEN:-}
      # Fontes públicas da IA (veja .env.example). Tudo opcional; vazio = a fonte não existe.
      INDEXER_SOURCES_SITE_URL: ${INDEXER_SOURCES_SITE_URL:-}
      INDEXER_SOURCES_SITE_DOCUMENTS: ${INDEXER_SOURCES_SITE_DOCUMENTS:-}
      INDEXER_SOURCES_DOCUMENTS: ${INDEXER_SOURCES_DOCUMENTS:-}
      INDEXER_SOURCES_GITHUB_USERS: ${INDEXER_SOURCES_GITHUB_USERS:-}
      INDEXER_SOURCES_GITHUB_REPOS: ${INDEXER_SOURCES_GITHUB_REPOS:-}
      INDEXER_SOURCES_GITHUB_DISCOVER: ${INDEXER_SOURCES_GITHUB_DISCOVER:-false}
      INDEXER_SOURCES_GITHUB_EXCLUDE: ${INDEXER_SOURCES_GITHUB_EXCLUDE:-}
      INDEXER_SOURCES_GITHUB_MAX_REPOS: ${INDEXER_SOURCES_GITHUB_MAX_REPOS:-30}
      INDEXER_SOURCES_LINKEDIN_URL: ${INDEXER_SOURCES_LINKEDIN_URL:-}
    volumes:
      - ai-models:/models
    tmpfs:
      # exec: o ONNX Runtime e o tokenizador extraem as bibliotecas nativas para cá e as carregam daqui.
      # O tamanho cobre o clone raso de um repositório de até 50 MB.
      - /tmp:exec,mode=1777,size=512m
    # ai-egress só para sair à internet (snapshot, GitHub, Hugging Face); sem rede com o CRUD nem com o Caddy.
    networks: [ai-egress, ai-data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      ai-migrate:
        condition: service_completed_successfully

  ai-api:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/javai-ai-api:${JAVAI_TAG:?defina no .env}
    environment:
      AI_DB_URL: jdbc:postgresql://postgres-ai:5432/ai?logServerErrorDetail=false&ApplicationName=ai-api
      AI_READER_PASSWORD: ${AI_READER_PASSWORD:?defina no .env}
      AIAPI_MODEL_DIR: /models
      # Chat (Fase 4). Sem a chave, o Turnstile ou os modelos, o chat responde 503 de manutenção e o MCP segue no ar.
      AIAPI_CHAT_ENABLED: ${JAVAI_CHAT_ENABLED:-true}
      # Página /admin (só leitura). Sem usuário e senha (16+ caracteres) a rota nem existe.
      AIAPI_ADMIN_USER: ${ADMIN_UI_USER:-}
      AIAPI_ADMIN_PASSWORD: ${ADMIN_UI_PASSWORD:-}
      # Para o botão "Corrigir no CRUD" da tela Treinar: o endereço público do CRUD (vazio = o botão some).
      AIAPI_ADMIN_CRUD_URL: ${CRUD_PUBLIC_URL:-}
      AIAPI_ADMIN_INDEXER_TOKEN: ${INDEXER_TRIGGER_TOKEN:-}
      AIAPI_CHAT_OPENROUTER_KEY: ${OPENROUTER_API_KEY:-}
      AIAPI_CHAT_TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      AIAPI_CHAT_TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-gilvanborges.com.br,www.gilvanborges.com.br}
      AIAPI_CHAT_HISTORY_SECRET: ${HISTORY_SECRET:-}
      AIAPI_CHAT_MODELS_FAST: ${JAVAI_MODELS_FAST:-}
      AIAPI_CHAT_MODELS_STRONG: ${JAVAI_MODELS_STRONG:-}
      AIAPI_CHAT_MAX_PRICE_COMPLETION: ${JAVAI_MAX_PRICE_COMPLETION:-0}
      AIAPI_CHAT_DAILY_BUDGET_USD: ${JAVAI_DAILY_BUDGET_USD:-1.00}
    volumes:
      # O modelo é baixado e verificado pelo ai-indexer; aqui só é lido.
      - ai-models:/models:ro
    tmpfs:
      # exec: o ONNX Runtime e o tokenizador extraem as bibliotecas nativas para cá e as carregam daqui.
      - /tmp:exec,mode=1777,size=128m
    # ai-edge: só fala com o Caddy. ai-data: só fala com o banco da IA. ai-egress: só para sair à internet (Turnstile,
    # Jev e OpenRouter). Nenhuma das três tem contêiner do CRUD: o ai-api não alcança o admin-api nem a rede edge.
    networks: [ai-edge, ai-data, ai-egress]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      ai-migrate:
        condition: service_completed_successfully

networks:
  edge: {}
  # Sem saída para a internet e sem nenhum contêiner da IA: o banco do CRUD só existe para o admin-api.
  admin-data:
    internal: true
  # Saída à internet do lado da IA, separada da rede edge do CRUD.
  ai-egress: {}
  # Sem saída para a internet e sem nenhum contêiner do CRUD: o banco da IA só existe para os serviços da IA.
  ai-data:
    internal: true
  # Entre o Caddy e o ai-api, e nada mais.
  ai-edge:
    internal: true
  # Entre o Caddy e o gateway do Controlei (outro projeto Compose, na mesma VPS), e nada mais. Externa porque o
  # Controlei tem ciclo de deploy proprio. Subnet fixa: docker network create --subnet 172.30.50.0/24 controlei-edge
  controlei-edge:
    external: true
    name: controlei-edge

volumes:
  postgres-admin-data: {}
  conteudo: {}
  postgres-ai-data: {}
  ai-models: {}
