spring:
  application:
    name: ai-indexer
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AI_DB_URL:jdbc:postgresql://postgres-ai:5432/ai?logServerErrorDetail=false&ApplicationName=ai-indexer}
    username: ai_indexer
    # Sem valor padrão: sem a senha no ambiente, o app não sobe.
    password: ${AI_INDEXER_PASSWORD}
    hikari:
      maximum-pool-size: 3

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

# Actuator só na porta interna; nada é publicado fora da rede do Docker.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

indexer:
  snapshot-base-url: ${INDEXER_SNAPSHOT_BASE_URL:https://conteudo.gilvanborges.com.br}
  poll-interval: ${INDEXER_POLL_INTERVAL:PT5M}
  max-repo-size-kb: ${INDEXER_MAX_REPO_SIZE_KB:51200}
  model-dir: ${INDEXER_MODEL_DIR:/models}
  embedding-threads: ${INDEXER_EMBEDDING_THREADS:2}
  repo-min-interval: ${INDEXER_REPO_MIN_INTERVAL:PT30M}
  # Token da porta interna usada pelo botão "reindexar" do /admin. Vazio = porta desligada (404).
  trigger-token: ${INDEXER_TRIGGER_TOKEN:}
  sources:
    site-url: ${INDEXER_SOURCES_SITE_URL:}
    site-documents: ${INDEXER_SOURCES_SITE_DOCUMENTS:}
    documents: ${INDEXER_SOURCES_DOCUMENTS:}
    github-users: ${INDEXER_SOURCES_GITHUB_USERS:}
    github-repos: ${INDEXER_SOURCES_GITHUB_REPOS:}
    github-discover: ${INDEXER_SOURCES_GITHUB_DISCOVER:false}
    github-exclude: ${INDEXER_SOURCES_GITHUB_EXCLUDE:}
    github-max-repos: ${INDEXER_SOURCES_GITHUB_MAX_REPOS:30}
    linkedin-url: ${INDEXER_SOURCES_LINKEDIN_URL:}
    check-interval: ${INDEXER_SOURCES_CHECK_INTERVAL:PT30M}
