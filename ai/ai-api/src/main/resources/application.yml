spring:
  application:
    name: ai-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AI_DB_URL:jdbc:postgresql://postgres-ai:5432/ai?logServerErrorDetail=false&ApplicationName=ai-api}
    username: ai_reader
    # Sem valor padrão: sem a senha no ambiente, o app não sobe.
    password: ${AI_READER_PASSWORD}
    hikari:
      maximum-pool-size: 3
      # Somente leitura de ponta a ponta: o papel já não escreve no índice, e a conexão também não tenta.
      read-only: true

server:
  port: 8080
  # Sem o cabeçalho Server e sem detalhes de erro: nada que ajude a mapear o serviço.
  server-header: ""
  max-http-request-header-size: 8KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 64KB
    threads:
      max: 100
    connection-timeout: 10s

# Actuator só na porta interna; nada é publicado fora da rede do Docker.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

aiapi:
  allowed-origins: ${AIAPI_ALLOWED_ORIGINS:https://gilvanborges.com.br}
  rate-limit-per-minute: ${AIAPI_RATE_LIMIT_PER_MINUTE:60}
  reload-interval: ${AIAPI_RELOAD_INTERVAL:PT30S}
  model-dir: ${AIAPI_MODEL_DIR:/models}
  embedding-threads: ${AIAPI_EMBEDDING_THREADS:2}
  admin:
    # Porta interna do ai-indexer para o botão "reindexar". Sem token o botão some e a página só avisa.
    indexer-url: ${AIAPI_ADMIN_INDEXER_URL:http://ai-indexer:8080}
    indexer-token: ${AIAPI_ADMIN_INDEXER_TOKEN:}
